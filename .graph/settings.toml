repository = "bmo-receiver"
base = false

[coverage]
# Every Cargo package's src/, and no other folder: the tests, the TypeScript client generated from
# docs/openapi.json and the checked-in example all stand outside it.
layout = "bmo-next"
extensions = ["rs"]
# The service package's crate root, which lists its modules and declares the version.
unindexed = ["src/lib.rs"]
