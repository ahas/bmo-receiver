# How the testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.

testbed = 0
name = "receiver"

# The Cargo workspace is tested as the root project. The TypeScript client in `crates/receiver-client/ts` is a
# project of its own, found by its manifest and its lockfile, and checked and tested by its manifest's `check`
# script.
[test]
languages = ["cargo", "bun"]
setup = ["bun install --frozen-lockfile --cwd crates/receiver-client/ts"]

# The tests make their own scratch databases on the server, so no template is named.
[test.database]
# Every unit talks to one Postgres server, and a test's own minutes stretch with whatever share of the server
# and the runner it gets while a whole-suite run crowds both; two database-using files at once keeps each test
# inside the per-test limit the gate watches by.
max_files = 2

[tools]
# The receiver's own tools, each checked by the command its tool.toml names.
dir = "tools"

[check]
# The sweeps that read the tree before anything runs: the glossary's terms, Korean in the code, the README's
# folder table and the dependencies the manifests name. The ledger is the debt of Korean left in a code file,
# a file it does not name being allowed none; no code file of this repository holds any.
quick = ["wording", "korean", "layout", "dependencies", "cargo-profile", "shared-versions", "personal-data"]
wording_document = "docs/wording.md"
korean_ledger = "korean-ledger.json"
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-secret-shapes", "bmo-ui"]

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

# No static step is declared for the workspace. The testbed's own Cargo workspace check formats and lints every
# member, every target compiled, through its Cargo verb in the shared build directory, wherever a change marks a
# crate, and the change check compiles every crate a change marks; a change that marks none has no Rust to judge.

# The service's binary and each tool's executable go into a release's bin/.
[build]
binaries = ["bmo-receiver", "rooms-tool", "send-tool", "wait-tool"]

# The receiver's own deploy tree, and the data root it shares with the services that read its files. The
# configuration stands under the data root as env/receiver.toml, and each release links to it as settings.toml,
# the file the service reads in its working directory (docs/boundary-api.md, 「Configuration」).
[deploy]
root = "~/.local/share/bmo-receiver"
link = "deploy"
data_root = "~/.local/share/bmo/data"
env_links = [{ link = "settings.toml", target = "env/receiver.toml" }]
# The service's user unit, marked bot: the repository's one service, whose health the deployment waits on.
units = ["deploy/*.service"]
# Answers 0 once the service the deployed configuration answers up (docs/boundary-api.md, 「Health」).
health = "~/.local/share/bmo-receiver/deploy/bin/bmo-receiver --config ~/.local/share/bmo-receiver/deploy/settings.toml health"
# The service is up once its health answers ready: no span it must stay up for besides.
stay_up_seconds = 0
# Answers 0 where no work stands under way that the restart would cut, a chat turn or a research run, asked from
# the release just before the flip and waited on (docs/boundary-api.md, 「The service and its commands」, `quiet`).
quiet = "bin/bmo-receiver --config settings.toml quiet"

# The unit command, linked into the folder holding `bmo`, the first folder `bmo` looks for unit commands in. The
# link names this repository's deploy tree, whose own link stands across releases; a link made to the release
# being deployed would dangle once a later deployment prunes that release.
[[deploy.step]]
id = "link-unit-command"
phase = "before-flip"
command = '''
set -eu
bmo_dir="$(dirname "$(command -v bmo)")"
ln -sfn "$HOME/.local/share/bmo-receiver/deploy/bin/bmo-receiver" "$bmo_dir/bmo-receiver"
'''

# Where the receiver's tools find it: the data root's env/receiver.env, written from the configuration.
[[deploy.step]]
id = "tool-env"
phase = "before-flip"
command = "bin/bmo-receiver --config settings.toml tool-env"

# Each tool placed in its folder's .placed/, the folder the tool host reads: the executable the release's bin/
# holds, its manifest, the schemas and the manuals beside it (docs/boundary-api.md, 「Its tools」).
[[deploy.step]]
id = "place-tools"
phase = "before-flip"
command = '''
set -eu
for tool in rooms send wait; do
  rm -rf "tools/$tool/.placed"
  mkdir -p "tools/$tool/.placed"
  cp "bin/$tool-tool" "tools/$tool/tool.toml" "tools/$tool/"*.json "tools/$tool/.placed/"
  for manual in "tools/$tool/"*.md; do
    if [ -e "$manual" ]; then cp "$manual" "tools/$tool/.placed/"; fi
  done
done
'''

# The placed tools registered with the tool host under this service's name, so every release carries its tools
# without a hand on the registry and an entry a release no longer holds leaves the catalogue with it; the host's
# command stands in its own deploy tree.
[[deploy.step]]
id = "register-tools"
phase = "after-health"
command = '''
set -eu
put="$HOME/.local/share/bmo-pocket/deploy/bin/bmo-pocket"
"$put" put --service receiver --placed --allow room.tools tools/rooms/.placed
"$put" put --service receiver --placed --allow room.tools --allow room.chat --allow room.send tools/send/.placed
"$put" put --service receiver --placed --allow room.tools tools/wait/.placed
'''
