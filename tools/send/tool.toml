# The sends the agents make into rooms, each asking the running receiver for the send through its routes, as the
# `bmo` commands doing the same sends ask it (docs/chat-mcp.md, 「How a call runs」): a line said in a room or in
# the consult room, a picture or an album, a file or an album of files, a voice note, a reaction, a pin, a
# sticker, a fair draw and a fixed line. The crate's own test holds every entry here to the Rust tool answering
# it.

[tool]
name = "send"
protocol = 1
language = "rust"
build = 'cargo build --release -p send-tool && cp "$BMO_CARGO_TARGET/release/send-tool" "$BMO_TOOL_OUT/"'
check = 'cargo test -p send-tool'
run = ["send-tool"]
timeout = 180

[[entry]]
namespace = "bmo"
name = "say"
description = "Put a line in a room, through the output gates, without waiting for it."
input = "say.json"
hints = { open_world = true }
capabilities = ["room.tools"]

[entry.facts]
verb = "text"

[[entry]]
namespace = "bmo"
name = "consult"
description = "Say a line in the consult room under your own name, to settle work of yours that overlaps another agent's; answers with each agent's window there."
input = "consult.json"
hints = { open_world = true }
capabilities = ["room.tools"]

[entry.bundle."room.chat"]
shown = ["text", "reply"]

[[entry]]
namespace = "bmo"
name = "photo"
description = "Send a picture, or several as one album."
input = "photo.json"
hints = { open_world = true }
capabilities = ["room.tools"]

[entry.bundle."room.send"]
shown = ["pictures", "caption"]

[entry.facts]
verb = "album"

[[entry]]
namespace = "bmo"
name = "file"
description = "Send a file from this machine, or several as one album, with a caption."
input = "file.json"
hints = { open_world = true }
capabilities = ["room.tools"]

[entry.bundle."room.send"]
shown = ["files", "caption"]

[entry.facts]
verb = "document"

[[entry]]
namespace = "bmo"
name = "voice"
description = "Send an OGG/Opus voice note from this machine, with its caption."
input = "voice.json"
hints = { open_world = true }
capabilities = ["room.tools"]

[entry.bundle."room.send"]
shown = ["path", "caption", "transcript"]

[entry.facts]
verb = "voice"

[[entry]]
namespace = "bmo"
name = "react"
description = "Put an emoji reaction on a message, or clear the agent's own with an empty emoji."
input = "react.json"
hints = { open_world = true }
capabilities = ["room.tools"]

[entry.bundle."room.send"]
shown = ["message", "emoji"]

[entry.facts]
verb = "reaction"

[[entry]]
namespace = "bmo"
name = "pin"
description = "Pin a message quietly, or unpin it."
input = "pin.json"
hints = { open_world = true }
capabilities = ["room.tools"]

[entry.bundle."room.send"]
shown = ["message", "unpin"]

[entry.facts]
verb = "pin"

[[entry]]
namespace = "bmo"
name = "sticker"
description = "Send one of the deployment's stickers by its emoji."
input = "sticker.json"
hints = { open_world = true }
capabilities = ["room.tools"]

[entry.bundle."room.send"]
shown = ["emoji"]

[entry.facts]
verb = "sticker"

[[entry]]
namespace = "bmo"
name = "random_draw"
description = "Draw fairly for anything decided by chance — dice, a number, winners, an order, a tie-break — and post the result with its seed in the room. sync hands the result back to state in this reply; async hands it to the next turn, for a turn that announces the draw and ends."
input = "random_draw.json"
hints = { open_world = true }
capabilities = ["room.tools"]

[entry.facts]
verb = "text"
icon = "material-symbols:casino-outline-sharp"

[[entry]]
namespace = "bmo"
name = "fixed_line"
description = "Say a fixed line in a room by its code and fields, rendered by the web unit's language packs without the output gates or any session."
input = "fixed_line.json"
hints = { open_world = true }
capabilities = ["room.tools"]

[entry.bundle."room.send"]
shown = ["code", "fields"]

[entry.facts]
verb = "text"
