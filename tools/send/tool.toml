# The sends the agents make into rooms, each asking the running receiver for the send through its routes, as the
# `bmo` commands doing the same sends ask it (docs/chat-mcp.md, 「How a call runs」): a line said in a room, a
# picture or an album, a file or an album of files, a voice note, a reaction, a pin, a sticker, a fair draw and a
# fixed line. Every entry is unbounded: a call ends with the receiver's answer or its
# connection failing, so the tool's `timeout`, which the manifest format asks of every tool, bounds no call. The
# crate's own test holds every entry here to the Rust tool answering it.

[tool]
name = "send"
protocol = 1
language = "rust"
build = 'cargo build --release -p send-tool && cp "$BMO_CARGO_TARGET/release/send-tool" "$BMO_TOOL_OUT/"'
check = 'cargo test -p send-tool'
run = ["send-tool"]
timeout = 180

[[entry]]
namespace = "bmo"
name = "say"
description = "Put a line in a room, through the output gates, without waiting for it."
input = "say.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[entry.facts]
verb = "text"

[[entry]]
namespace = "bmo"
name = "photo"
description = "Send a picture, or several as one album."
input = "photo.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[entry.bundle."room.send"]
shown = ["pictures", "caption"]

[entry.facts]
verb = "album"

[[entry]]
namespace = "bmo"
name = "file"
description = "Send a file from this machine for the room to save or open, or several as one album, with a caption. A picture the room is to look at goes through photo, never through this entry."
input = "file.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[entry.bundle."room.send"]
shown = ["files", "caption"]

[entry.facts]
verb = "document"

[[entry]]
namespace = "bmo"
name = "voice"
description = "Send an OGG/Opus voice note from this machine, with its caption."
input = "voice.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[entry.bundle."room.send"]
shown = ["path", "caption", "transcript"]

[entry.facts]
verb = "voice"

[[entry]]
namespace = "bmo"
name = "react"
description = "Put an emoji reaction on a message, or clear the agent's own with an empty emoji."
input = "react.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[entry.bundle."room.send"]
shown = ["message", "emoji"]

[entry.facts]
verb = "reaction"

[[entry]]
namespace = "bmo"
name = "pin"
description = "Pin a message quietly, or unpin it."
input = "pin.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[entry.bundle."room.send"]
shown = ["message", "unpin"]

[entry.facts]
verb = "pin"

[[entry]]
namespace = "bmo"
name = "sticker"
description = "Send one of the deployment's stickers by its emoji."
input = "sticker.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[entry.bundle."room.send"]
shown = ["emoji"]

[entry.facts]
verb = "sticker"

[[entry]]
namespace = "bmo"
name = "random_draw"
description = "Draw fairly for anything decided by chance — dice, a number, winners, an order, a tie-break — post the result with its seed in the room, and answer with the result."
input = "random_draw.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[entry.facts]
verb = "text"
icon = "material-symbols:casino-outline-sharp"

[[entry]]
namespace = "bmo"
name = "fixed_line"
description = "Say a fixed line in a room by its code and fields, rendered by the web unit's language packs without the output gates or any session."
input = "fixed_line.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[entry.bundle."room.send"]
shown = ["code", "fields"]

[entry.facts]
verb = "text"
