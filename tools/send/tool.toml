# The sends the agents make into rooms, each asking the running receiver for the send through its routes, as the
# `bmo` commands doing the same sends ask it (docs/chat-mcp.md, 「How a call runs」): words handed to another room,
# a picture or an album, a file or an album of files, a voice note, the round's own answer said aloud, a reaction,
# a pin, a sticker and a fair draw. No entry puts words in a room: speak marks the round's answer, which the round
# writes and its stages check, to go out as a voice note. Every entry is unbounded: a call ends with the receiver's answer, its connection
# failing or the bound its act gives the receiver passing, so the tool's `timeout`, which the manifest format asks
# of every tool, bounds no call. The crate's own test holds every entry here to the Rust tool answering it.

[tool]
name = "send"
protocol = 1
language = "rust"
build = 'cargo build --release -p send-tool && cp "$BMO_CARGO_TARGET/release/send-tool" "$BMO_TOOL_OUT/"'
check = 'cargo test -p send-tool'
run = ["send-tool"]
timeout = 180

[[entry]]
namespace = "bmo"
name = "say"
description = "Hand words to another room, the room chat names: that room's round writes and reviews them as its message. Words for this room go into your answer, never here."
input = "say.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[[entry]]
namespace = "bmo"
name = "photo"
description = "Send a picture, or several as one album, with no caption: what you say of it goes into your answer."
input = "photo.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[entry.bundle."room.send"]
shown = ["pictures", "caption"]

[[entry]]
namespace = "bmo"
name = "file"
description = "Send a file from this machine for the room to save or open, or several as one album, with no caption: what you say of it goes into your answer. A picture the room is to look at goes through photo, never through this entry."
input = "file.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[entry.bundle."room.send"]
shown = ["files", "caption"]

[[entry]]
namespace = "bmo"
name = "voice"
description = "Hand an OGG/Opus voice note from this machine to another room, whose round says its words as its message. A voice note for this room is refused: its words go into your answer."
input = "voice.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[entry.bundle."room.send"]
shown = ["path", "caption", "transcript"]

[[entry]]
namespace = "bmo"
name = "speak"
description = "Say this round's answer aloud yourself: the answer you write in this round goes out as a voice note in your own voice, your face speaking it, its words standing with the note. Name the emotion it is said with. Only for your own round in the room it answers."
input = "speak.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[[entry]]
namespace = "bmo"
name = "react"
description = "Put an emoji reaction on a message, or clear the agent's own with an empty emoji."
input = "react.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[entry.bundle."room.send"]
shown = ["message", "emoji"]

[[entry]]
namespace = "bmo"
name = "pin"
description = "Pin a message quietly, or unpin it."
input = "pin.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[entry.bundle."room.send"]
shown = ["message", "unpin"]

[[entry]]
namespace = "bmo"
name = "sticker"
description = "Send one of the deployment's stickers by its emoji."
input = "sticker.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[entry.bundle."room.send"]
shown = ["emoji"]

[[entry]]
namespace = "bmo"
name = "random_draw"
description = "Draw fairly for anything decided by chance — dice, a number, winners, an order, a tie-break — post the result with its seed in the room, and answer with the result."
input = "random_draw.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[entry.facts]
icon = "material-symbols:casino-outline-sharp"
