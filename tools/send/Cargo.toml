[package]
name = "send-tool"
description = "The sends the agents make into rooms: a line, a picture, a reminder, a reaction, a pin, a sticker and a fair draw."
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "send-tool"
path = "src/main.rs"
test = false

[dependencies]
# The turn a call reads and the sends asked of the running receiver, as the `bmo` commands doing the same sends ask them.
room-calls.workspace = true
# The call protocol, the answer and the manifest held to the executable.
tool-call.workspace = true
# The brain the reminder entry answers, and the agency whose reset point overtakes a turn.
receiver-ports.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
