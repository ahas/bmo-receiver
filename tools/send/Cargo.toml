[package]
name = "send-tool"
description = "The sends the agents make into rooms: a line, a picture, a reaction, a pin, a sticker and a fair draw."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# One test target, the harness at tests/main.rs, with a module per file of tests (bmo-chat's
# docs/conventions.md, 「Rust builds」).
autotests = false

[[bin]]
name = "send-tool"
path = "src/main.rs"
test = false

[dependencies]
# The turn a call reads and the sends asked of the running receiver, as the `bmo` commands doing the same sends ask them.
room-calls.workspace = true
# The call protocol, the answer and the manifest held to the executable.
tool-call.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }

[[test]]
name = "main"
path = "tests/main.rs"
