# The reminders and watches an agent sets, one entry a call `bmo use` runs on its own so that its end wakes the
# agent (docs/reminders.md): a wait for a moment, or a shell check run until it holds, named as the wait's own
# `check`. It reads no turn and calls no unit. It is unbounded, since the unit the call runs in ends it at its
# longest run. The crate's own test holds the entry here to the Rust tool answering it.

[tool]
name = "wait"
protocol = 1
language = "rust"
build = 'cargo build --release -p wait-tool && cp "$BMO_CARGO_TARGET/release/wait-tool" "$BMO_TOOL_OUT/"'
check = 'cargo test -p wait-tool'
run = ["wait-tool"]
timeout = 60

[[entry]]
namespace = "bmo"
name = "wait"
description = "Wait some seconds or until a moment, or run a shell check every few seconds until it exits 0, and answer with the note: a reminder or a watch, run as bmo use bmo/wait --async so its end wakes you in the room."
manual = "wait.md"
input = "wait.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true
