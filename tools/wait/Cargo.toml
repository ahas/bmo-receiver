[package]
name = "wait-tool"
description = "The reminders and watches bmo use runs on their own: a wait for a moment, and a check run until it holds."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# One test target, the harness at tests/main.rs, with a module per file of tests (bmo-chat's
# docs/conventions.md, 「Rust builds」).
autotests = false

[[bin]]
name = "wait-tool"
path = "src/main.rs"
test = false

[dependencies]
# The moment a wait names, read as RFC 3339 writes it.
chrono.workspace = true
# The call protocol, the answer and the manifest held to the executable.
tool-call.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "time", "io-util"] }

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
