[package]
name = "rooms-tool"
description = "The rooms an agent opens, reads and names its answerers for."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rooms-tool"
path = "src/main.rs"
test = false

[dependencies]
# One typed call for each route of the running receiver, the room added on the owner's word among them.
receiver-client.workspace = true
reqwest.workspace = true
room-calls.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tool-call.workspace = true
tokio.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
