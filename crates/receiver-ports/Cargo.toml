[package]
name = "receiver-ports"
description = "The receiver's ports to the other units: each call it makes there, as a trait and an HTTP client."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# One test target, the harness at tests/main.rs, with a module per file of tests (bmo-chat's
# docs/conventions.md, 「Rust builds」).
autotests = false

[dependencies]
# The chat services' provider routes, and the client the receiver reaches each one through.
bmo-chat-client.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# The agency's event stream, read as server-sent events.
sse-stream.workspace = true
tokio.workspace = true

[dev-dependencies]
# The stand-in each port's client is tried against.
axum.workspace = true
# The tool host's stand-in stands on a socket in a folder of the test's own.
tempfile.workspace = true
tokio.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
