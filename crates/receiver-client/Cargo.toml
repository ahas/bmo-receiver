# The receiver service's client: every body and member of its API as a Rust type, one call for each route, and
# the OpenAPI document generated from those types. The TypeScript package beside it is generated from the same
# document.
[package]
name = "receiver-client"
description = "The chat receiver's fixed API: every body and member as a Rust type, one call for each route, and the OpenAPI document generated from them."
version.workspace = true
edition.workspace = true
license.workspace = true
# One test target, the harness at tests/main.rs, with a module per file of tests (bmo-chat's
# docs/conventions.md, 「Rust builds」).
autotests = false

[dependencies]
reqwest = { workspace = true, features = ["json", "query"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[dev-dependencies]
# The receiver's route stood on a loopback port, for a call through the client to be read back.
axum.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[[test]]
name = "main"
path = "tests/main.rs"
