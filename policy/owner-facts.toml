# What the owner's session is told of the agency's events that no other part words (docs/wake.md, 「What the
# agency's events wake」): a job's run fallen to a lesser model, the overtime order and a road's change. `{name}` marks what each
# line carries.

# A job's run that answered on a lesser model than it was launched on: the {role} it ran as, the {place} it ran
# in, the {model} it fell to and the one it was {launched} on, the {job} it ran for where it names one, and what
# became of the session its role keeps there.
[worker_downgraded]
fact = "A job run as the role \"{role}\" in {place} came off {model} instead of {launched}: the account's safeguard balked at that session's context."
# Where the run ran: its repository with the checkout of it beside it, or the checkout alone where no
# repository holds it any longer.
place = "the repository \"{repository}\" (checkout \"{checkout}\")"
place_none = "the checkout \"{checkout}\", which no repository holds any longer"
job = " It happened on job #{job}."
intent = "tell the owner which role, in which repository, fell to which model."
dropped = "That session has been dropped; the next job of this role in this checkout opens a fresh one. No room is waiting on it."
kept = "The owner turned the downgrade heal off for this repository, so that session is kept: the next job of this role in this checkout goes on in the same session, launched on {model} rather than on the model the role's order names, until a fresh session is opened. No room is waiting on it."
# The role a run names where the agency names none.
role_none = "unnamed"
# One line of it stands at a time for each checkout and role: the kind is this, the checkout and the role.
kind = "worker-downgrade"

# The order a run past its clock hands the default answerer in the owner's chat: the {ask} number, {what} it does, its
# {agent} and {run}, how long it has run ({running}) since when ({since}), its {bound}, its last {activity}, the
# word that nothing is cut without a verdict, and the {verb} a verdict is given with. A last activity is told
# by its moment ({at}), how long before the ask it was ({before}) and what it was ({what}).
[overtime]
head = "[A run reached its clock — keep it or cut it]"
ask = "Ask: #{ask}"
what = "What: {what}"
run = "Agent: {agent}, run {run}"
running = "Running for: {running}, since {since}"
bound = "Clock: {bound}"
activity = "Last activity: {activity}"
activity_at = "{at}, {before} before this ask: {what}"
activity_unknown = "a line of unknown kind"
activity_none = "nothing recorded"
nothing_cut = "Nothing has been cut: the run goes on until you answer, and nothing cuts it without your verdict."
steps = [
  "What to do — read the procedure overtime first:",
  "1. Decide yourself whether to keep it or cut it. Do not ask the owner: this is left to you.",
  "2. Answer with `{verb} --keep {ask} [--for <length>] --why '<one line>'` or `{verb} --cut {ask} --why '<one line>'`.",
  "3. Anything in the system you see needs fixing is filed as a TODO item and fixed by a job.",
  "4. Then answer <<SKIP>>, unless you cut it or filed an item: then tell the owner so in one short line.",
]
# The order of one run stands at a time: the kind is this and the run's name.
kind = "overtime"
sort = "overtime"

# A supervisor's or a role's road the agency moved, returned or found closed (docs/wake.md, 「Quiet instructions」,
# 「A road's change」): the {row}, a supervisor or a role by its {name}, a road as its {provider}, {model} and
# {account}, each provider's {reason}, the {command} a person reopens a road with, set apart exactly as the agency
# wrote it, and the moment ({at}) the first road reopens. One line stands at a time for each supervisor and each
# role: the kind is this, `supervisor:<name>` or `role:<name>`.
[road]
kind = "road-changed"
sort = "road"
supervisor = "the supervisor {name}"
role = "the role {name}"
row_none = "a row the agency did not name"
road = "{provider} · {model}"
road_account = "{provider} · {model} (account {account})"
road_none = "the head of its order"
reason = "{provider}: {reason}"
reasons_joint = "; "
reasons_none = "the agency named no reason"
moved = "The work of {row} moved from {from} to {to}. The roads passed, and why: {reasons}."
returned = "The work of {row} is back on {to}, from {from}."
closed = "No road of {row} can answer now. Why each road could not: {reasons}."
command = "The owner reopens it with this command, written here exactly as the agency gave it, on a line of its own:\n{command}"
no_command = "Nothing waits on the owner: each road reopens by itself."
reopens = "The first road reopens by itself at {at}."
intent = "tell the owner, in his private chat, what became of the road the work goes out on."
follow_up = "Tell the owner now in one sentence, in his language and in your own words: what moved from what to what and why, or what is closed and why. Where the facts carry a command, give it after that sentence exactly as written, character for character, in a code span: never reword, shorten or translate it, since a command reworded does not run. Name the moment it reopens where the facts name one. Do not skip: the owner is to hear it."
# How the instruction is laid out: the {fact}, then what it is for ({intent}) and what follows ({follow_up}).
frame = "{fact}\n\nWhat this is for: {intent}\n\nWhat follows: {follow_up}"
