# What the owner's session is told of the agency's events that no other part words (docs/wake.md, 「What the
# agency's events wake」): a worker fallen to a lesser model, and the overtime order. `{name}` marks what each
# line carries.

# A worker's session that answered on a lesser model than its job was launched on: the {worker}, the {model} it fell
# to and the one it was {launched} on, the {job} it ran for where it names one, and what became of the session.
[worker_downgraded]
fact = "A run of the job worker \"{worker}\" came off {model} instead of {launched}: the account's safeguard balked at that session's context."
job = " It happened on job #{job}."
intent = "tell the owner which worker fell to which model."
dropped = "That session has been dropped; the next job on this worker and model opens a fresh one. No room is waiting on it."
kept = "The owner turned the downgrade heal off for this worker, so that session is kept: the next job on this worker goes on in the same session, launched on {model} rather than on the model its tier names, until a fresh session is opened. No room is waiting on it."
# One line of it stands at a time for each worker: the kind is this and the worker's name.
kind = "worker-downgrade"
ttl_minutes = 60

# The order a run past its clock hands the chat agent in the owner's chat: the {ask} number, {what} it does, its
# {agent} and {run}, how long it has run ({running}) since when ({since}), its {bound}, its last {activity}, the
# moment ({by}) the agency cuts it with no verdict, and the {verb} a verdict is given with. A last activity is told
# by its moment ({at}), how long before the ask it was ({before}) and what it was ({what}).
[overtime]
head = "[A run reached its clock — keep it or cut it]"
ask = "Ask: #{ask}"
what = "What: {what}"
run = "Agent: {agent}, run {run}"
running = "Running for: {running}, since {since}"
bound = "Clock: {bound}"
activity = "Last activity: {activity}"
activity_at = "{at}, {before} before this ask: {what}"
activity_unknown = "a line of unknown kind"
activity_none = "nothing recorded"
nothing_cut = "Nothing has been cut: the run goes on until you answer. With no answer by {by} the agency cuts it itself and records that it did."
steps = [
  "What to do — read the procedure overtime first:",
  "1. Decide yourself whether to keep it or cut it. Do not ask the owner: this is left to you.",
  "2. Answer with `{verb} --keep {ask} [--for <length>] --why '<one line>'` or `{verb} --cut {ask} --why '<one line>'`.",
  "3. Anything in the system you see needs fixing is filed as a TODO item and fixed by a job.",
  "4. Then answer <<SKIP>>, unless you cut it or filed an item: then tell the owner so in one short line.",
]
# The order of one run stands at a time: the kind is this and the run's name.
kind = "overtime"
sort = "overtime"
