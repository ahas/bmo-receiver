# What the receiver hears of the tool host's catalogue and tells the supervisors of it (docs/boundary-api.md,
# 「The tool host」; docs/wake.md, 「Quiet instructions」, 「The tool host's changes」). `{name}` marks what each line
# carries.

# How long the stream waits before it is opened again once it dropped or could not be opened, and how long it
# may hear nothing, not even the host's ping, before it is read as dropped, in seconds.
reopen_seconds = 5
silent_seconds = 60

# The notice a supervisor is told by: one line stands at a time for each agent and tool, the kind this, the
# agent's name and the tool's, under the sort named.
kind = "tools-changed"
sort = "tools-changed"
summary = "The tool host's {tool} changed"
# The short marker a change's notice opens on, and the rule the room's block carries for it: what the facts after
# the marker say, that a tool is read with `bmo use <tool> --describe` before it is called, and that nothing needs
# saying in any room. The notice itself carries only the marker and the facts.
marker = "TOOL HOST CHANGED."
rule = "WHEN A QUIET INSTRUCTION IS MARKED {marker} — the tool host's catalogue changed, and the facts after the marker say what became of the tool and each of its entries. Read a tool with `bmo use <tool> --describe` before you call it, and never call one this list says is gone. Nothing needs saying in any room: this only tells you what your tools are now."
# What became of the {tool}, and its {entries}, each written as `entry` with its full {name}, how it is
# {reached} and the first sentence of its description ({summary}), joined by `joint`.
placed = "The tool host now serves {tool}: {entries}."
updated = "The tool host serves an updated {tool}, replacing the version it served before: {entries}."
removed = "The tool host no longer serves {tool}; these entries are gone: {entries}."
entry = "{name} ({reached}) — {summary}"
joint = "; "
no_entries = "no entry shown to a session"
