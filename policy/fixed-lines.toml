# The plain sentence each fixed line falls back to where the web unit's language packs cannot render it
# (docs/voiced-notices.md, 「Lines that stay fixed」), by the rooms' language and the line's code. `{name}` marks a
# field of the line, filled in as words: a list as its members, a draw's result as its values. A code with no
# sentence in the rooms' language is dropped, never sent as its code and fields.

[sentences.ko]
rest-begins = "사용 한도에 걸려 한동안 답할 수 없어요. 한도가 풀리면 다시 답할게요."
provider-down = "모델 제공처가 지금 응답하지 않아 답할 수 없어요. 돌아오면 다시 답할게요."
run-broken = "{agent}의 작업이 중간에 멈췄어요. {cause}"
chat-denied = "이 방은 이제 듣지 않아요. 여기서 하는 말은 더 남기지 않습니다."
going-down-for-update = "업데이트를 위해 잠시 내려갔다가 곧 돌아옵니다."
going-down = "잠시 다시 시작했다가 곧 돌아옵니다."
memory-tidying = "기억 정리 중입니다. 완료 시 대답합니다. 잠시만 기다려주세요."
draw = "추첨 {number}번 결과: {result} (시드 {seed}, 다음 시드 약속 {next})"
account-let-in = "계정 {by}이(가) 계정 {account}을(를) 이 방에 들였어요."
account-left = "계정 {account}이(가) 이 방에서 나갔어요."
account-taken-out = "계정 {by}이(가) 계정 {account}을(를) 이 방에서 내보냈어요."
accounts-let-in = "계정 {by}이(가) 계정 {accounts}을(를) 대화상대로 추가했어요."
unit-let-in = "계정 {by}이(가) {unitName}을(를) 대화상대로 추가했어요."
supply-closed = "이 방의 실행에 쓸 공급원이 남아 있지 않아 지금은 답할 수 없어요. 설정의 공급에서 확인해 주세요."
session-handed-over = "{agent}의 세션을 새로 시작했어요. {reason}"

[sentences.en]
rest-begins = "A usage limit has been reached, so I cannot answer for a while. I will answer again once it lifts."
provider-down = "The model provider is not answering right now, so I cannot answer. I will answer again once it is back."
run-broken = "The work of {agent} stopped partway. {cause}"
chat-denied = "This room is no longer listened to. What is said here is no longer kept."
going-down-for-update = "Going down for an update for a moment; back shortly."
going-down = "Restarting for a moment; back shortly."
memory-tidying = "Tidying my memory. I will answer once it is done; one moment, please."
draw = "Draw {number}: {result} (seed {seed}, next seed commitment {next})"
account-let-in = "Account {by} let account {account} into this room."
account-left = "Account {account} left this room."
account-taken-out = "Account {by} took account {account} out of this room."
accounts-let-in = "Account {by} let accounts {accounts} into this room."
unit-let-in = "Account {by} let the members of {unitName} into this room."
supply-closed = "No supply source is left for runs in this room, so nothing can answer now. Check the supply in your settings."
session-handed-over = "The session of {agent} was handed over to a fresh one. {reason}"
