# What sending into a room asks of an agent, as far as the receiver reads it (docs/chat-mcp.md, 「How a call
# runs」): the bundle that opens sending, and the bundles every supervisor's session holds, which the agency's roles
# policy lists as `supervisor`. A role's bundles are the agency's, read with its roles (`GET /roles`).

# The bundle that opens sending into a room.
send = "room.send"

# The bundles every supervisor's session holds.
supervisor = ["room.chat", "room.send", "web.read"]
