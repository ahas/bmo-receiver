# The secret shapes (docs/messages.md, 「Secrets taken out」): the runs a message's words are read for before
# anything keeps or forwards them, each replaced by the marker. The shapes are read in the order they stand
# here, each over the words the shapes above it left, so a run a narrower shape took is a marker by the time
# a wider shape reads it. Each is a regular expression as the receiver's regex engine reads one, with no
# look-around; where a shape names a part of its run `secret`, that part alone is replaced and the rest of the
# run stands. A shape's `spared` patterns are the runs it leaves alone: a run of the shape lying wholly inside
# a run of one of them stands, and every other shape still reads it. `(?-u:\b)` is a boundary between an
# ASCII letter, digit or underscore and anything else, so a run glued to a word of another script still starts
# where it starts. A shape is narrow by design: a run an ordinary sentence could hold is no secret's shape.

# What a run is replaced by. It is no shape's run, so words read twice lose nothing more.
marker = "<redacted-secret>"

# A private key block, to its end line or, where the paste stops before it, to the end of the words.
[[shapes]]
name = "pem-private-key"
pattern = '''(?s)-----BEGIN [A-Z ]*PRIVATE[ ]KEY-----.*?(?:-----END [A-Z ]*PRIVATE[ ]KEY-----|\z)'''

# A JSON web token: a header and a payload, each base64 of a JSON object, and its signature.
[[shapes]]
name = "jwt"
pattern = '''(?-u:\b)eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'''

# A provider key written `sk-` and a long run after it: OpenAI's, OpenRouter's, DeepSeek's and Anthropic's
# alike.
[[shapes]]
name = "sk-key"
pattern = '''(?-u:\b)sk-[A-Za-z0-9_-]{20,}'''

# GitHub's personal, OAuth, user, server and refresh tokens, and its fine-grained personal access token.
[[shapes]]
name = "github-token"
pattern = '''(?-u:\b)(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{22,})'''

# Slack's bot, user and app-level tokens.
[[shapes]]
name = "slack-token"
pattern = '''(?-u:\b)xox[abp]-[A-Za-z0-9-]{10,}'''

# An AWS access key id.
[[shapes]]
name = "aws-access-key"
pattern = '''(?-u:\b)AKIA[0-9A-Z]{16}(?-u:\b)'''

# A Google API key.
[[shapes]]
name = "google-api-key"
pattern = '''(?-u:\b)AIza[0-9A-Za-z_-]{35}'''

# A Hugging Face token.
[[shapes]]
name = "hf-token"
pattern = '''(?-u:\b)hf_[A-Za-z0-9]{30,}'''

# A Telegram bot token: the account's number, a colon and its secret.
[[shapes]]
name = "telegram-bot-token"
pattern = '''(?-u:\b)[0-9]{8,10}:[A-Za-z0-9_-]{35}'''

# The password in a link's user part, `scheme://user:password@host`, of any scheme and any length. The user,
# the scheme and the host stand.
[[shapes]]
name = "url-password"
pattern = '''(?i)(?-u:\b)[a-z][a-z0-9+.-]*://[^\s/?#@:"'<>]+:(?P<secret>[^\s/?#@"'<>]+)@'''

# The credentials of an `Authorization: Basic` header, quoted or not: a user and a password in base64.
[[shapes]]
name = "basic-auth"
pattern = '''(?i)(?-u:\b)authorization["']?[ \t]*[=:][ \t]*["']?basic[ \t]+(?P<secret>[A-Za-z0-9+/]{8,}={0,2})'''

# A bearer token, wherever the word `Bearer` stands before it: twenty or more of the letters a token is
# written in. A placeholder such as `<token>` or `$TOKEN` is no such run.
[[shapes]]
name = "bearer-token"
pattern = '''(?i)(?-u:\b)bearer[ \t]+(?P<secret>[A-Za-z0-9._~+/-]{20,}=*)'''

# A session string Telethon or Pyrogram writes: a run of three hundred or more base64 letters, padding
# included. No word, address or path runs that long without a space, a dot or a slash. It spares an http(s)
# link, a marker an earlier shape left inside it included: a run that long inside a link is the link's own, a
# redirect target in base64, an ad click's path or a page's saved search, and the link must open as it was
# written. Every other shape still reads the link, so a secret set by its name, a signature, a JWT or a key in
# it is taken out all the same.
# The spare spells the marker as `marker` above does, and the secret shapes' tests fail where the two part.
[[shapes]]
name = "session-string"
pattern = '''(?-u:\b)[A-Za-z0-9_-]{300,}={0,2}'''
spared = [
  '''(?i)https?://(?:[^\s"'<>]|<redacted-secret>)+''',
]

# A platform's own token: sixty-four hexadecimal digits standing alone. A commit's hash is forty.
[[shapes]]
name = "hex-64"
pattern = '''(?-u:\b)[0-9A-Fa-f]{64}(?-u:\b)'''

# A name ending in key, token, secret, password, passwd, sig or signature, in any case and quoted or not, set
# with `=` or `:` to a value of twelve or more characters that holds no space, quote or angle bracket: an
# `access_token`, an `api_key`, a signed link's `sig`, `Signature` or `X-Amz-Signature` and its
# `X-Amz-Security-Token`. The name stands; the value is replaced. It spares a console secret-request link,
# which names a secret's file rather than holding one: a link to the console's page of a room whose `secret`
# parameter is a file name, with nothing beside it but the `kind`, `fields`, `for` and `user` parameters. A link
# with any other parameter is read as words are.
[[shapes]]
name = "named-value"
pattern = '''(?i)(?-u:\b)(?:[a-z0-9]+[_.-])*(?:api)?(?:key|token|secret|password|passwd|sig|signature)["']?[ \t]*[=:][ \t]*["']?(?P<secret>[^\s"'<>]{12,})'''
spared = [
  '''https?://[^\s/?#"'<>]+(?:/[^\s/?#"'<>]+)*/rooms/-?[0-9]+\?(?:(?:kind|fields|for|user)=[^\s&#"'<>]*&)*secret=[A-Za-z0-9%][A-Za-z0-9%._-]*(?:&(?:kind|fields|for|user)=[^\s&#"'<>]*)*''',
]
