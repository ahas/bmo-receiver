# A companion's turn as the receiver composes it and checks its answer: where its guard cuts a turn going nowhere,
# how it waits for its engine, how the room's words and what the gate attached are laid out, and the fixed lines
# its log and its refusals are written in. The line a room hears when a turn is cut is the fixed line
# `companion-cut`. `{name}` marks what each line carries.

# The answer that is no answer at all: nothing is sent and the turn ends answered.
skip = "<<SKIP>>"
# How long a line of the system prompt is before an answer carrying it whole is taken for one that repeats the
# prompt: shorter lines are a persona's own sayings, which an answer may well echo.
echoed_line_chars = 60
# How often a turn waiting for its engine looks again whether the job holding it has ended.
engine_wait_ms = 2000
# The stage a companion's whole answer is recorded at, and the stage its turn's own run is written down at.
answer_stage = "companion"
turn_stage = "chat"
# The note a session hands over with is no note where it says only this.
no_note = "none"

# Where a turn is cut short as going nowhere: repetition first, the caps on its calls and its time last.
[limits]
# How many failed results of one tool in a row cut the turn.
failures = 6
# How many calls in a row that repeat an earlier one and learn nothing cut the turn, and how many calls back a
# repeated call is looked for.
repeats = 8
repeat_window = 8
# How alike two inputs of one tool are, from 0 to 1, to be one call repeated.
likeness = 0.9
# The most tool calls a turn's words take, and the longest their runs go on.
calls = 80
minutes = 30

# How a room's words read in a turn.
[words]
# The mark the owner's lines, and only the owner's, open with.
owner_mark = "[owner]"
# The opening every quiet instruction is read under.
quiet_head = "Quiet instruction from the system:"

# The blocks a turn's words open with.
[blocks]
reference_opening = "Reference for this turn ({count}):"
reference_closing = "END OF REFERENCE"
note_opening = "Your note from your previous session in this room:"
note_closing = "END OF NOTE"

# The run a turn is logged as, by the room and the moment in seconds.
[runs]
turn = "chat:{chat}:{at}"

# The lines of a turn's log.
[log]
start = "{name}: {messages} message(s), {instructions} instruction(s)"
skipped = "skipped"
answered = "answered"
cleared = "This turn starts a new session, as the session reset asked."
system_changed = "The system prompt changed; the conversation so far goes on under the new system prompt."
carried = "An earlier run spent {calls} tool call(s) and {minutes} minute(s) on these words; this one goes on with what is left."
waits = "{name} waits for its engine: job {job}{item}"
waits_item = " of item #{item}"

# What the answer is read under as it is cleaned, and how it is written down.
[answer]
label = "a message the companion {name} is about to send to a chat room"
verdict = "REPLY: {text}"
verdict_chars = 120
echoed_words = "the harness's own words \"{words}\""
echoed_line = "a line of its system prompt \"{line}…\""

# Why a turn fails, each in one sentence.
[refused]
no_pin = "the companion has no model pinned, so it cannot answer"
no_provider = "the provider {provider} the companion is pinned to is not in this build"
no_line = "the provider {label} does not carry a companion's answer"
no_model = "the model {model} the companion is pinned to is gone or has no address"
echoed = "the answer of {name} repeated what it was given, so it was not sent: {echoed}"
empty = "the answer of {name} was empty"

# A turn its guard cut short: the quiet instruction the chat agent is told in the owner's chat, with its kind and
# sort. The room hears the fixed line `companion-cut`.
[cut]
instruction = [
  "{name} ({agent}), a companion, had its turn in the room {room} ({chat}) cut short by its turn guard: {reason}",
  "Its run was stopped; the words it was answering stay taken, the room was told in one line under the companion's number, and its session in that room opens afresh with its next turn there.",
  "The turn's log is the run {run}.",
  "Nothing is asked of you for one cut. Where the same companion keeps being cut, file the malfunction as an item with that log as its record. Do not announce this instruction itself.",
]
kind = "companion-cut:{agent}:{chat}"
sort = "companion_cut"
