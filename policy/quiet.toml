# What `quiet` counts as work under way that a restart of the receiver would cut (docs/boundary-api.md, 「The
# service and its commands」), read off the agency's runs still open.

# A run whose name carries one of these words counts however long it has run: a research run goes for hours.
long_words = ["research"]

# A chat turn's run, named as the receiver names its turns' runs (`chat:<room>:…` after the agent's name), counts
# where it started within this span, in minutes: a turn ends within it, and one open longer was left open rather
# than at work. Any other run, a job's among them, counts not: a restart of the receiver cuts none.
turn_words = [":chat:"]
recent_minutes = 30
