# The draft process (docs/drafting.md): the questions a round's session is asked, the first riding the round's
# turn, the table that says which, the lines a question turn is written in and the longest final text. The
# console's rows and texts stand over these (`GET`/`PUT /draft-processes`, `GET`/`PUT /draft-questions`).

# The line the round's own turn, its draft turn, closes on (docs/drafting.md, 「The questions」): `{names}` are the
# questions the round follows, in their order, joined by `+`. Each question's own text, and that the answer is the
# message, stand in the room's block (the session's system prompt). `arrived` opens the one closing check asked
# once the message stands, where messages arrived after the draft turn went out. <<SKIP: <why>>> anywhere in an
# answer ends the process with nothing sent, the reason one line saying why; a bare <<SKIP>> names no reason and is
# read as no verdict, so the same turn comes back under `skip_again`. <<DONE #<number>>> and
# <<SEPARATE #<number>>> mark a message shown to the round as needing no answer or as answered in a round of its
# own. `{voice}` in `stages_head` and `arrived` is
# `voice`: the message is written in the voice the persona sets for the person answered, not as notes.
round = "DRAFT ROUND ({names})."
# What a round turn that skipped with no reason is asked once more with, said as its whole turn: the session holds
# the round already. A second answer naming no reason ends the round as a skip whose reason is recorded as none.
skip_again = "That skip named no reason, so it is not taken as a skip. A turn that sends nothing answers <<SKIP: <why>>>, the reason one line in English saying why. Answer this turn again: the message, or a skip naming its reason."
arrived_marker = "ARRIVED MESSAGES."
arrived = "WHEN A TURN IS MARKED ARRIVED MESSAGES — the message as it stands is shown first, then the messages that arrived after the draft round went out and before the message did, each with its number. Answer with the message as it should now go out, whole: it takes the standing message's place, so write all of it, not only what changes or what it adds, its fold mark with it where it is to fold under the rule for folding you were given. Answer with nothing but the marks to send the standing message unchanged. <<DONE #<number>>> marks a message that needs no answer, <<SEPARATE #<number>>> one to be answered in a round of its own after this one, <<REPLY #<number>>> the one your message answers where it is to go out as a reply to it, under the rule for replies you were given; <<SKIP: <why>>> sends nothing, the reason one line saying why. {voice}"
standing = "The message as it stands:"
voice = "Write the message as the message itself, in the voice your persona sets for the person you answer, its register toward them included, and in their language, never as notes or a report."

# The stage instructions, as the room's block (the session's system prompt) carries them (docs/drafting.md,
# 「The questions」): a head, then one line a question by its name, each from `[questions]` below with the
# console's row standing over it. The block names the questions the process's row follows.
# A round's turn names only the questions its round follows.
stages_head = "THE DRAFT ROUND — WHAT IT FOLLOWS. A turn that closes on a DRAFT ROUND line is the round's draft turn, and the line names the questions it follows, joined by +. Follow each named question in the order named, in that one turn and with your tools, before you write; the text of each stands below by its name. Then write the message: it is your answer to the turn, and no question is asked again as a turn of its own. {voice}"
stage = "{name}: {text}"

# The review the gate asks before a message goes out (docs/drafting.md, 「The review」): the marker that names its
# turn, the instructions the room's block carries, the lines its turn shows, and the verdict it answers. It audits
# whether the draft round carried out the questions its line named; `followed` shows those names again, `{names}`
# as the round's line carried them. A
# rejection returns the draft to be done and written again with that reason, eight times at most; the eighth sends the
# last draft and the end row names the reasons in order. A round's turn carries data only: the instruction for a
# revision stands in the room's block, and the turn carries the reason under `reason`.
[review]
marker = "REVIEW ROUND."
instruction = "WHEN THE ROUND IS THE REVIEW — audit the draft round you just answered. For each question its line named, shown again in this turn, decide whether you carried it out in that round: what it says to read was read, each fact the message rests on has the source it names, the brain was brought up to date as it says, and what it says of promises was done or the words changed. Then read the draft against that work, the room's words and the rules and knowledge this round carries. Where the message says a road, a tool, a permission, a file or a capability is missing or cannot work, or puts a step on the owner, decide whether the round actually tried it with its tools and whether the message says what it tried and what answered: a step put on the owner that the round could take itself, or a thing said to be impossible on no attempt, is one a rejection names. Answer {pass} alone when every named question was carried out and the draft is right to send as it stands. Answer {reject} when one was not, or the draft is not, naming the one question not carried out or the one thing that must change, and nothing else; do no work and do not rewrite the message here."
revise = "WHEN THE REVIEW HAS REJECTED THE MESSAGE — do now, with your tools, what the reason shown names as not done, then write the message again, changing what the reason names and keeping the rest. Your answer is the message."
followed = "The questions the draft round followed: {names}"
draft = "The message as it stands:"
words = "The room's words:"
rules = "The rules and knowledge this round carries:"
handed = "[{path}] (handed in this turn)"
room_handed = "The room's words {ids} were handed in this turn; only the lines after them are new."
pass = "PASS"
reject = "REJECT: <reason>"
reason = "The review rejected the message. Reason: {reason}"

# The questions, by name, as the owner set them. `final` is always the last question of a process.
[questions]
intent = "What does the person who said this intend? Whether to answer is already decided: consider why they said it and what they want."
information = "What information does the answer need, and what more must be read? Where what you hold falls short and the brain may hold it, open its index or search it and read now with your tools."
facts = "Is that information true, and where did each fact come from? A fact about the system's live state (a login, a usage window, a model, what is running, what is deployed, a setting) counts only when read now from the service that owns it, by its route or its tool; a file, a cache or an earlier answer that mirrors it is not a source. Read now what has no source. What cannot be read now is said as not confirmed, never as fact. Was anything unconfirmed, or a variable still undecided, spoken of as known or guessed at?"
memory = "Bring the brain up to date with its tools: recall the memories this answer needs, including similar ones; engrave the facts established so far; mark as done the promises and checks that were fulfilled; invalidate what this conversation showed no longer holds; and confirm what still holds, so its lastConfirmedAt moves. Where this turn's brain index says consolidation is due, consolidate in this turn as well: read the episodes not yet consolidated with brain_unconsolidated, take the first the brain answers, as many as this turn can afford and never all of them, and draft what each one worth keeping comes to (a fact, a reflection or a correction, with the live fact it would confirm, strengthen or replace). Review a draft before you write it where it would replace a live fact or carries importance 8 or more. The review is your own second reading, here in this turn: it costs reading, not a second model. Read again the episodes the draft rests on and the live fact it would close, and ask yourself three things. Do those episodes actually say or show it? Is it the same as a live fact? Then confirm or strengthen that fact rather than writing it anew. Does it contradict a live fact that those episodes do not overturn? Then write nothing for it and leave those episodes unconsolidated. Write only a draft that passes; a draft below that bar is written as it stands. Write each draft with brain_learn, then mark every episode you read consolidated with brain_consolidated, those that came to nothing among them; leave out only the episodes of a draft the review stopped for a contradiction. Do not call brain_fold here."
promises = "Where something is said like a promise, was it actually done? Where it was not, do it now with your tools, or change the words."
final = "Looking at what this turn established, write the message to send to this room now, in the voice your persona sets for the person you answer. To send nothing, answer <<SKIP: <why>>> alone: the reason one line in English saying why, never left out, since a skip naming no reason is not taken as a skip."

# The process table: one process for every provider, tier and agent. `rounds` are the questions every turn's
# round follows, in order, whatever the turn carried — a quiet instruction alone or the room's words, short or
# long — and `off` the questions of that list that are switched off, each keeping its place and not followed
# (left out for none). A deployment that still carries the old two rows loads with them
# ignored in favour of this one, and so do the console's per-key rows. `ceiling_seconds` and `past_ceiling` are
# read and ignored: no clock ends a round.
[[process]]
provider = "*"
tier = "*"
agent = "*"
rounds = ["intent", "information", "facts", "memory", "promises", "final"]
