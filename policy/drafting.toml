# The draft process (docs/drafting.md): the questions a round's session is asked, the first riding the round's
# turn, the table that says which, the lines a question turn is written in and the longest final text. The
# console's rows and texts stand over these (`GET`/`PUT /draft-processes`, `GET`/`PUT /draft-questions`).

# The longest final text the `length` check lets go, in characters.
max_chars = 4000

# The lines a question turn is written in. `opening` opens the first question, which rides the round's own turn,
# where it is not also the last. `lead` opens every later question but the last, `last_lead` the last; `{number}`
# is the question's place, `{count}` how many the process asks and `{name}` the question's name. `waiting` closes
# every later question but the last, `{ids}` the messages waiting for the round. `arrived` opens the one closing
# check asked once the message stands, where messages arrived after the last question went out. An answer opening
# on <<SEND>> is the message, what follows the marker; <<SKIP>> anywhere in an answer ends the process with
# nothing sent; <<DONE #<number>>> and <<SEPARATE #<number>>> mark a message shown to the round as needing no
# answer or as answered in a round of its own.
opening = """The message is written last. This process first establishes the information the answer needs, and engraves each fact it establishes in the brain with your tools as it goes. This is question {number} of {count} ({name}); as the first question it is the freest.
- Where the words are a simple call, a greeting or a short word, answer now and end.
- Where the facts already found and what you now know are enough, answer now.
- Confidence in a fact comes from its dates: the brain's facts carry validFrom and lastConfirmedAt. A fact found or confirmed recently is said with confidence. Where you are not confident, or cannot tell whether a fact you found is stale, search quietly before deciding (web/web_search, web/web_fetch, gate/translate, the brain's tools), then answer. Never tell the room that something may be out of date: the search is yours, and the room hears only its result.
- Otherwise answer the question below with notes and go on: what you read, which facts you established (engraved in the brain), and what you still do not know. Write no message now.
To answer now, begin the answer with <<SEND>>: what follows it is the message, sent to this room as written, and the process ends there. <<SKIP>> in any answer ends the process and nothing is sent."""
lead = "The process asks question {number} of {count} ({name}). The message is written last: answer this question with notes, namely what you read, the facts you established, engraved in the brain with your tools as you establish them, and what you still do not know. Every tool you have is open. Where you now hold everything the message needs, begin your answer with <<SEND>>: what follows it is the message, sent to the room as you write it, and the process ends there. Nothing in a message hedges that a fact may be out of date: a fact found or confirmed recently is said with confidence, and one you are not confident of is searched for quietly first. <<SKIP>> in any answer ends the process and nothing is sent. Messages that arrived since the last answer stand below the question, each with its number: this round's message answers them as well, unless you write <<DONE #<number>>> for one that needs no answer or <<SEPARATE #<number>>> for one to be answered in a round of its own after this one."
last_lead = "The last question of the process, {number} of {count} ({name}). Your answer to it is the message, sent to the room as you write it; <<SKIP>> sends nothing. Messages that arrived since the last answer stand below the question, each with its number: the message answers them as well, unless you write <<DONE #<number>>> for one that needs no answer or <<SEPARATE #<number>>> for one to be answered in a round of its own after this one."
waiting = "Messages waiting in the room: {ids}. They are shown with the next question; do not answer them now."
arrived = "Messages arrived after your last answer and before the message went out; they stand below, each with its number. Your last answer is the message as it stands. Answer with the message to send now, written again so it answers them as well, or nothing but the marks to send it as it stands. <<DONE #<number>>> marks a message that needs no answer, <<SEPARATE #<number>>> one to be answered in a round of its own after this one; <<SKIP>> sends nothing."

# The questions, by name: the seven the owner set. `final` is always the last question of a process.
[questions]
intent = "What does the person who said this intend? Whether to answer is already decided: consider why they said it and what they want."
information = "What information does the answer need, and what more must be read? Where the reference selected for you falls short, read now with your tools."
facts = "Is that information true? Was anything unconfirmed, or a variable still undecided, spoken of as known or guessed at?"
memory = "Bring the brain up to date with its tools: recall the memories this answer needs, including similar ones; engrave the facts established so far; mark as done the promises and checks that were fulfilled; invalidate what this conversation showed no longer holds; and confirm what still holds, so its lastConfirmedAt moves."
promises = "Where something is said like a promise, was it actually done? Where it was not, do it now with your tools, or change the words."
fit = "Does it fit the room's rules, the persona and the language the other person speaks?"
final = "Looking at what came in meanwhile and at the notes established so far, write the message to send to this room now. To send nothing, answer <<SKIP>> alone."

# The process table's default rows, matched most specific first: an agent's row before a provider's, a
# provider's before a tier's; "*" stands for any. `rounds` are an ordinary turn's questions, `light` a light
# turn's (quiet instructions alone, or room words of at most `light_chars` characters and no file);
# `ceiling_seconds` bounds the whole process from the round's turn, past which `past_ceiling` asks `final` at
# once (`send`) or sends nothing (`skip`).

# The small models' process.
[[process]]
provider = "*"
tier = "*"
agent = "*"
rounds = ["intent", "information", "facts", "memory", "promises", "final"]
light = ["final"]
light_chars = 12
ceiling_seconds = 150
past_ceiling = "send"

# Claude's process.
[[process]]
provider = "claude-code"
tier = "*"
agent = "*"
rounds = ["information", "memory", "promises", "final"]
light = ["final"]
light_chars = 12
ceiling_seconds = 150
past_ceiling = "send"
