# The draft process (docs/drafting.md): the questions a round's session is asked, the first riding the round's
# turn, the table that says which, the lines a question turn is written in and the longest final text. The
# console's rows and texts stand over these (`GET`/`PUT /draft-processes`, `GET`/`PUT /draft-questions`).

# The lines a round turn is written in. A turn shows only which round it is and whether that round may send; the
# question's own text, what a send does and the voice a message is written in are assembled into the room's block
# (the session's system prompt). `opening` opens the first round, which rides the round's own turn, `lead` every
# later round but the last, `last_lead` the last; `{number}` is the round's place, `{count}` how many the process
# asks, `{name}` the question's name, and `{send}` the permission `send_open` or `send_closed`. `waiting` closes
# every later round but the last, `{ids}` the messages waiting for the round. `arrived` opens the one closing
# check asked once the message stands, where messages arrived after the last round went out. An answer opening on
# <<SEND>> is the message, what follows the marker, wherever it stands; <<SKIP>> anywhere in an answer ends the
# process with nothing sent; <<DONE #<number>>> and <<SEPARATE #<number>>> mark a message shown to the round as
# needing no answer or as answered in a round of its own. `{voice}` in `send` and `arrived` is `voice`: an answer
# that may be the message is written in the voice the persona sets for the person answered, not as notes.
opening = "Round {number}/{count} ({name}): {send}"
lead = "Round {number}/{count} ({name}): {send}"
send_open = "SEND"
send_closed = "NOTES"
last_lead = "Round {number}/{count} ({name}): {send}"
waiting = "Messages waiting in the room: {ids}. They are shown with the next question; do not answer them now."
arrived = "Messages arrived after your last answer and before the message went out. The message as it stands is shown below, then the messages that arrived, each with its number. Answer with the message as it should now go out, whole: it takes the standing message's place, so write all of it, not only what changes or what it adds, its fold mark with it where it is to fold under the rule for folding you were given. Answer with nothing but the marks to send the standing message unchanged. <<DONE #<number>>> marks a message that needs no answer, <<SEPARATE #<number>>> one to be answered in a round of its own after this one, <<REPLY #<number>>> the one your message answers where it is to go out as a reply to it, under the rule for replies you were given; <<SKIP>> sends nothing. {voice}"
standing = "The message as it stands:"
voice = "Write what may be the message as the message itself, in the voice your persona sets for the person you answer, its register toward them included, and in their language, never as notes or a report."

# The stage instructions, as the room's block (the session's system prompt) carries them (docs/drafting.md,
# 「The questions」): a head, then one line a question by its name, each from `[questions]` below with the
# console's row standing over it. The block names the questions the process's row may ask, ordinary and light.
# A round's turn names only which round it is and whether that round writes the message or notes only.
stages_head = "THE DRAFT PROCESS — WHAT EACH ROUND ASKS. A round's turn names the round it is and whether that round writes the message or only notes; the question it answers stands below by its name."
stage = "{name}: {text}"
# What a round's one-word send permission means, and the voice a message is written in, said once here instead of
# in every round's turn.
send = "SENDING FROM A ROUND — a round's line ends in SEND where that round may write the message itself, and NOTES where it writes notes only and the message is written at the message round. Where the round may send: begin the answer with <<SEND>> where what you now hold is enough; what follows it is the message, reviewed before it goes out, and the process ends there. {voice}"

# The review the gate asks before a message goes out (docs/drafting.md, 「The review」): the marker that names its
# turn, the instructions the room's block carries, the lines its turn shows, and the verdict it answers. A
# rejection returns the draft to the final question with that reason, eight times at most; the eighth sends the
# last draft and the end row names the reasons in order. A round's turn carries data only: the instruction for a
# revision stands in the room's block, and the turn carries the reason under `reason`.
[review]
marker = "REVIEW ROUND."
instruction = "WHEN THE ROUND IS THE REVIEW — read the draft against the room's words and the rules and knowledge it carries. Answer {pass} alone when it is right to send as it stands. Answer {reject} when it is not, naming the one thing that must change, and nothing else; do not rewrite the message here."
revise = "WHEN THE REVIEW HAS REJECTED THE MESSAGE — write the message again, changing what the reason shown names and keeping the rest. Your answer is the message."
draft = "The message as it stands:"
words = "The room's words:"
rules = "The rules and knowledge this round carries:"
handed = "[{path}] (handed in this turn)"
room_handed = "The room's words {ids} were handed in this turn; only the lines after them are new."
pass = "PASS"
reject = "REJECT: <reason>"
reason = "The review rejected the message. Reason: {reason}"

# The questions, by name, as the owner set them. `final` is always the last question of a process.
[questions]
intent = "What does the person who said this intend? Whether to answer is already decided: consider why they said it and what they want."
information = "What information does the answer need, and what more must be read? Where what you hold falls short and the brain may hold it, open its index or search it and read now with your tools."
facts = "Is that information true, and where did each fact come from? A fact about the system's live state (a login, a usage window, a model, what is running, what is deployed, a setting) counts only when read now from the service that owns it, by its route or its tool; a file, a cache or an earlier answer that mirrors it is not a source. Read now what has no source. What cannot be read now is said as not confirmed, never as fact. Was anything unconfirmed, or a variable still undecided, spoken of as known or guessed at?"
memory = "Bring the brain up to date with its tools: recall the memories this answer needs, including similar ones; engrave the facts established so far; mark as done the promises and checks that were fulfilled; invalidate what this conversation showed no longer holds; and confirm what still holds, so its lastConfirmedAt moves. Where this turn's brain index says consolidation is due, consolidate in this turn as well: read the episodes not yet consolidated with brain_unconsolidated, take the first the brain answers, as many as this turn can afford and never all of them, and draft what each one worth keeping comes to (a fact, a reflection or a correction, with the live fact it would confirm, strengthen or replace). Review a draft before you write it where it would replace a live fact or carries importance 8 or more. The review is your own second reading, here in this turn: it costs reading, not a second model. Read again the episodes the draft rests on and the live fact it would close, and ask yourself three things. Do those episodes actually say or show it? Is it the same as a live fact? Then confirm or strengthen that fact rather than writing it anew. Does it contradict a live fact that those episodes do not overturn? Then write nothing for it and leave those episodes unconsolidated. Write only a draft that passes; a draft below that bar is written as it stands. Write each draft with brain_learn, then mark every episode you read consolidated with brain_consolidated, those that came to nothing among them; leave out only the episodes of a draft the review stopped for a contradiction. Do not call brain_fold here."
promises = "Where something is said like a promise, was it actually done? Where it was not, do it now with your tools, or change the words."
final = "Looking at what came in meanwhile and at the notes established so far, write the message to send to this room now, in the voice your persona sets for the person you answer. To send nothing, answer <<SKIP>> alone."

# The process table: one process for every provider, tier and agent. `rounds` are an ordinary turn's questions,
# `send_from` the question of `rounds` from whose answer on a send is read (empty for the first), `light` a light
# turn's (quiet instructions alone, or room words of at most `light_chars` characters and no file). A deployment that still carries the old
# two rows loads with them ignored in favour of this one, and so do the console's per-key rows. `ceiling_seconds`
# and `past_ceiling` are read and ignored: no clock ends a round.
[[process]]
provider = "*"
tier = "*"
agent = "*"
rounds = ["information", "facts", "memory", "promises", "final"]
send_from = "final"
light = ["final"]
light_chars = 12
