# The draft process (docs/drafting.md): the questions a round's session is asked, the first riding the round's
# turn, the table that says which, the lines a question turn is written in and the longest final text. The
# console's rows and texts stand over these (`GET`/`PUT /draft-processes`, `GET`/`PUT /draft-questions`).

# The longest final text the `length` check lets go, in characters.
max_chars = 4000

# How long one turn of the process runs before the journal says it ran long, once in the round, in seconds: the
# bound of a row that names none, the console's set among them. The room hears nothing of it.
turn_seconds = 120

# The lines a question turn is written in. `opening` opens the first question, which rides the round's own turn,
# where it is not also the last. `lead` opens every later question but the last, `last_lead` the last; `{number}`
# is the question's place, `{count}` how many the process asks and `{name}` the question's name. `{send}` in the
# opening and the lead is `send_open` where a send is read at the question and `send_closed` where it is not,
# `{from}` and `{name}` there the place and the name of the question a send is read from. `waiting` closes
# every later question but the last, `{ids}` the messages waiting for the round. `arrived` opens the one closing
# check asked once the message stands, where messages arrived after the last question went out. An answer opening
# on <<SEND>> is the message, what follows the marker, wherever it stands; <<SKIP>> anywhere in
# an answer ends the process with nothing sent; <<DONE #<number>>> and <<SEPARATE #<number>>> mark a message shown
# to the round as needing no answer or as answered in a round of its own. `{voice}` in `send_open`, `last_lead` and
# `arrived` is `voice`: an answer that may be the message is written in the voice the persona sets for the person answered, not as notes.
opening = "This round's question {number} of {count} ({name}), the first and the freest: answer it with notes, as the draft process in the room's block says. {send}"
lead = "The process asks question {number} of {count} ({name}): answer it with notes, as the draft process in the room's block says. {send}"
send_open = "Where the words are a simple call, a greeting or a short word, or what you now hold is enough for the message, answer now: begin the answer with <<SEND>>, what follows it is the message, sent to this room as written, and the process ends there. {voice}"
send_closed = "The message is asked for from question {from} ({name}) on. If it is already complete, write it now: begin with <<SEND>>, what follows is the message, sent to this room as written, and the process ends there; otherwise answer with notes."
last_lead = "The last question of the process, {number} of {count} ({name}). Your answer to it is the message, sent to the room as you write it; <<SKIP>> sends nothing. {voice}"
waiting = "Messages waiting in the room: {ids}. They are shown with the next question; do not answer them now."
arrived = "Messages arrived after your last answer and before the message went out. The message as it stands is shown below, then the messages that arrived, each with its number. Answer with the message as it should now go out, whole: it takes the standing message's place, so write all of it, not only what changes or what it adds. Answer with nothing but the marks to send the standing message unchanged. <<DONE #<number>>> marks a message that needs no answer, <<SEPARATE #<number>>> one to be answered in a round of its own after this one, <<REPLY #<number>>> the one your message answers; <<SKIP>> sends nothing. {voice}"
standing = "The message as it stands:"
voice = "Write what may be the message as the message itself, in the voice your persona sets for the person you answer, its register toward them included, and in their language, never as notes or a report."

# The questions, by name: the seven the owner set. `final` is always the last question of a process.
[questions]
intent = "What does the person who said this intend? Whether to answer is already decided: consider why they said it and what they want."
information = "What information does the answer need, and what more must be read? Where what you hold falls short and the brain may hold it, open its index or search it and read now with your tools."
facts = "Is that information true, and where did each fact come from? A fact about the system's live state (a login, a usage window, a model, what is running, what is deployed, a setting) counts only when read now from the service that owns it, by its route or its tool; a file, a cache or an earlier answer that mirrors it is not a source. Read now what has no source. What cannot be read now is said as not confirmed, never as fact. Was anything unconfirmed, or a variable still undecided, spoken of as known or guessed at?"
memory = "Bring the brain up to date with its tools: recall the memories this answer needs, including similar ones; engrave the facts established so far; mark as done the promises and checks that were fulfilled; invalidate what this conversation showed no longer holds; and confirm what still holds, so its lastConfirmedAt moves."
promises = "Where something is said like a promise, was it actually done? Where it was not, do it now with your tools, or change the words."
fit = "Does it fit the room's rules, the persona and the language the other person speaks?"
final = "Looking at what came in meanwhile and at the notes established so far, write the message to send to this room now, in the voice your persona sets for the person you answer. To send nothing, answer <<SKIP>> alone."

# The process table's default rows, matched most specific first: an agent's row before a provider's, a
# provider's before a tier's; "*" stands for any. `rounds` are an ordinary turn's questions, `send_from` the
# question of `rounds` from whose answer on a send is read (empty for the first), `light` a light turn's (quiet
# instructions alone, or room words of at most `light_chars` characters and no file); `turn_seconds`, where a row
# names it, is how long one turn runs before the journal notes it and it goes on. A row that still carries
# `ceiling_seconds` or `past_ceiling` loads with both ignored: no clock ends a round.

# The small models' process.
[[process]]
provider = "*"
tier = "*"
agent = "*"
rounds = ["information", "facts", "final"]
send_from = "facts"
light = ["final"]
light_chars = 12

# Claude's process.
[[process]]
provider = "claude-code"
tier = "*"
agent = "*"
rounds = ["information", "facts", "memory", "promises", "final"]
send_from = "facts"
light = ["final"]
light_chars = 12
