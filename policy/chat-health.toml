# What a room's session is told of its health (docs/voiced-notices.md): the facts and intents of the notices a
# room or the owner hears in the agent's own voice, what a failure order names a broken chat turn as, and the chat
# touch target as the receiver declares it. The agency keeps its own copy of the parts it says itself; these are the
# parts the receiver queues. `{name}` marks what each line carries. A round that stopped, failed or ended with
# nothing said sends no line to its room: only a broken run of the agent's own raises the order below.

# The provider answered again after an outage.
[outage_lifted]
fact = "The provider had stopped answering; a run has just come back from it, so the outage is over."
intent = "tell the owner the connection is back and you are answering again."
kind = "outage-lifted"

# A limit's rest over, told to the owner: the window has reset. An outage's rest lifts in silence, since whether
# the service is back is known only when a run answers.
[rest_lifted]
fact = "The usage limit's rest is over: the window has reset and you answer again as usual."
intent = "say you are back from the rest and answering again."
kind = "rest-lifted"

# What a failure order names a broken chat turn as, by where it was ({where}), and how often, in seconds, the
# orders nobody took up are looked over for the receiver's own last line.
[order]
what = "a chat turn of your own in {where}"
check_seconds = 60

# The cache warmer's touch of a quiet room's session: the chat touch target as the receiver declares it to the
# warmer. The touch carries the keepalive prompt and no instruction of its own, so it asks the session for no line.
[touch]
label = "the default answerer's one session, in the room it last stood in"
rank = 90
idle_ms = 2400000
lifetime_ms = 3600000
margin_ms = 0
ping_bound_ms = 1800000
warm_by_default = true
failure_touches = false
honours_idle_override = true
