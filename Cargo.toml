# The workspace: the receiver service's own package at the root, the crates it is built from under `crates/`,
# and the tools bound to it under `tools/`. The root package also holds the checks that span the repository and
# the service's integration tests in `tests/`. Each crate and tool is named as a member as it stands.
[workspace]
members = ["crates/receiver-codes", "crates/receiver-policy", "crates/receiver-ports"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "query", "tokio"] }
# The base library the receiver reaches every chat service through.
bmo-chat-client = { path = "../chat/client" }
futures-util = "0.3.34"
http = "1.3.1"
pulldown-cmark = { version = "0.13.0", default-features = false }
receiver-codes = { path = "crates/receiver-codes" }
receiver-policy = { path = "crates/receiver-policy" }
receiver-ports = { path = "crates/receiver-ports" }
reqwest = { version = "0.13.5", default-features = false }
sea-orm = { version = "1.1.20", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
sea-orm-migration = { version = "1.1.20", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio"] }
sse-stream = "0.2.6"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.20.0"
thiserror = "2.0.21"
tokio = { version = "1.47.0", features = ["macros", "rt", "rt-multi-thread", "sync"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[package]
name = "bmo-receiver"
description = "The chat receiver: rooms, their rules and rights, room windows, the turn's envelope and waking the agents."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# The receiver's database: its statements, its migrations, and the pool beneath them taken by itself for its
# options and its error codes.
sea-orm.workspace = true
sea-orm-migration.workspace = true
sqlx.workspace = true

[dev-dependencies]
# The repository checks read `cargo metadata` and the testbed's declaration.
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
