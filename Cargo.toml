# The workspace: the receiver service's own package at the root, the crates it is built from under `crates/`,
# and the tools bound to it under `tools/`. The root package also holds the checks that span the repository and
# the service's integration tests in `tests/`. Each crate and tool is named as a member as it stands.
[workspace]
members = ["crates/receiver-client", "crates/receiver-codes", "crates/receiver-policy", "crates/receiver-ports", "crates/room-calls", "crates/tool-call", "tools/send"]
resolver = "3"

[workspace.package]
version = "0.15.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "multipart", "query", "tokio"] }
# A moment written as the room's transcript shows it, in UTC.
chrono = "0.4.45"
# The base library the receiver reaches every chat service through.
bmo-chat-client = { path = "../../base/chat/client" }
# The binary's command line.
clap = { version = "4.5.40", features = ["derive"] }
futures-util = "0.3.34"
http = "1.3.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff"] }
# The machine's fonts, for the word drawn into a labelled picture.
resvg = "0.48.1"
inventory = "0.3.24"
# The bearer token a request carries, read off the headers of the receiver's own routes.
headers = "0.4.1"
pulldown-cmark = { version = "0.13.0", default-features = false }
# The shapes a text is cut by: the scaffolding, the markers, a wrapped document, a recording verb's call. The
# Unicode classes stand on because a digit class is read over any script's words.
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode"] }
receiver-client = { path = "crates/receiver-client" }
receiver-codes = { path = "crates/receiver-codes" }
receiver-policy = { path = "crates/receiver-policy" }
receiver-ports = { path = "crates/receiver-ports" }
# The env file a placed tool reads the receiver's address and token from.
dotenvy = "0.15.7"
room-calls = { path = "crates/room-calls" }
# The call protocol every tool bound to the receiver speaks.
tool-call = { path = "crates/tool-call" }
# The shape a tool's entry declares its arguments by.
schemars = "1.0.4"
reqwest = { version = "0.13.5", default-features = false }
# The seed a fair draw starts from, out of the system's cryptographic random source.
rand = "0.9.2"
# The digest a labelled picture is named by, so the same picture labelled twice is one file.
sha2 = "0.10.9"
sea-orm = { version = "1.1.20", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
sea-orm-migration = { version = "1.1.20", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
# A route's query, read into the shape the route takes.
serde_urlencoded = "0.7.1"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio"] }
sse-stream = "0.2.6"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.20.0"
thiserror = "2.0.21"
tokio = { version = "1.47.0", features = ["macros", "net", "rt", "rt-multi-thread", "sync"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
# A kept file's bytes served as HTTP serves a file: its type, its length and the ranges asked of it.
tower-http = { version = "0.6.11", default-features = false, features = ["fs"] }
# The content type a kept file's name implies, as the file serving reads it.
mime_guess = "2.0.5"
# A file's own name written into the header a download is saved under.
percent-encoding = "2.3.2"
# A web address read out of a text: its scheme, host and path, as the address itself says.
url = "2.5.8"

[package]
name = "bmo-receiver"
description = "The chat receiver: rooms, their rules and rights, room windows, the turn's envelope and waking the agents."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The chat services' receiver routes, which the receiver implements, and the router they are served by.
async-trait.workspace = true
axum.workspace = true
# A moment written as the room's transcript shows it.
chrono.workspace = true
bmo-chat-client.workspace = true
# The binary's command line.
clap.workspace = true
futures-util.workspace = true
# A picture a message carried, read, brought down, laid on white and written as JPEG as it is filed.
image.workspace = true
# The machine's fonts, for the word drawn into a labelled picture.
resvg.workspace = true
# What a room holds beyond its `chat_id` columns, declared beside the code that owns it.
inventory.workspace = true
headers.workspace = true
# The shapes a text is cut by.
regex.workspace = true
receiver-client.workspace = true
receiver-codes.workspace = true
receiver-policy.workspace = true
receiver-ports.workspace = true
# What the send tool and the receiver's own verbs share: the turn a call runs in, the sends asked of the
# running receiver, and the readings an answer is held to.
room-calls.workspace = true
# The receiver's database: its statements, its migrations, and the pool beneath them taken by itself for its
# options and its error codes; a room's record is read through sqlx's any driver, on the database or a copy of it.
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
sqlx = { workspace = true, features = ["any", "sqlite"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "signal", "time"] }
# The service's configuration file, read at start.
toml.workspace = true
# The web addresses a text is read for.
url.workspace = true
# A message's kept files and picture served to the console, each as HTTP serves a file.
tower.workspace = true
tower-http.workspace = true
mime_guess.workspace = true
percent-encoding.workspace = true
# The picture behind an address, fetched where the address is a web address.
reqwest.workspace = true
# The seed a fair draw starts from.
rand.workspace = true
# The digest a labelled picture is named by.
sha2.workspace = true

[dev-dependencies]
# The repository checks read `cargo metadata` and the testbed's declaration.
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
# The chat services' routes asked one request at a time, with no listener.
tower.workspace = true
